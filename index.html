<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>JoKenPô</title>
</head>

<body>

    <div class="bg-dinamico">

        <div class="container">
            <h1>JoKenPô</h1>
        <div class="buttons">
            <button id="rock" onclick="playHuman('rock')">&#x1F44A;</button>
            <button id="scissors" onclick="playHuman('scissors')">&#x270C;</button>
            <button id="paper" onclick="playHuman('paper')">&#x1F590;</button>
        </div>
            <p class="your-choice">Você jogou:</p>
            <p class="machine-choice">A máquina jogou:</p>
            <p class="result"></p>
            <p class="your-score">Sua Pontuação: <span id="human-score">0</span></p>
            <p class="machine-score">Pontuação Máquina: <span id="machine-score">0</span></p>
        </div>
    </div>
    <script src="./scripts.js"></script>

</body>

</html>
